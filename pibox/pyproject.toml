[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pibox"
# Canonical version source per ~/.claude/rules/49-versioning.md. The
# Makefile derives the docker tag from this, __init__.py reads it via
# importlib.metadata. Bump THIS file ONCE per release; everything else
# follows.
version = "0.10.0"
description = "pi-coding-agent adapter for aicodebox"
license = { text = "WTFPL" }
requires-python = ">=3.12"
authors = [{ name = "psyb0t" }]
dependencies = [
    "aicodebox>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pibox"]
