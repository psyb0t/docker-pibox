[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pibox"
# Canonical version source. The Makefile derives the docker tag from
# this value; __init__.py reads it at runtime via importlib.metadata.
# Bump THIS file ONCE per release; everything else follows.
version = "0.15.12"
description = "pi-coding-agent adapter for aicodebox"
license = { text = "WTFPL" }
requires-python = ">=3.12"
authors = [{ name = "psyb0t" }]
# Runtime deps live in the aicodebox base image (installed system-wide in the
# base's Dockerfile). The adapter itself has zero runtime deps beyond aicodebox,
# which the Dockerfile installs with `uv pip install --system --no-deps /opt/pibox`.
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["pibox"]

[dependency-groups]
# aicodebox in editable mode from the sibling repo so `uv lock` / `uv version`
# resolve locally. Docker builds don't use this — they build on the base image's
# already-present aicodebox.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.400",
    "aicodebox",
]

[tool.uv.sources]
aicodebox = { path = "../../docker-aicodebox", editable = true }
